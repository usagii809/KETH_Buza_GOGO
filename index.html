<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>태형이와 경은이의 부자 되기 프로젝트!!</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="부자 가계부" />
    <meta name="theme-color" content="#F2F4F6" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
    <!-- 🌙 화면이 그려지기 전에 다크 모드부터 입혀요 (흰 화면 번쩍임 방지) -->
    <script>
      try {
        var p = localStorage.getItem("themePref");
        var dark = p === "dark" || (p !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <!-- 🌱 첫 로딩 화면 (React가 뜨기 전부터 보이도록 여기에 직접 적어요 · src/ui/Splash.tsx와 같은 모양) -->
    <style>
      .splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #F2F4F6; color: #191F28; font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s; padding-bottom: 8vh; }
      html.dark .splash { background: #101014; color: #ECECF0; }
      .splash.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash-icon { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 10px 30px rgba(49, 130, 246, 0.28); animation: splash-grow 1.6s ease-in-out infinite; }
      .splash-title { margin-top: 6px; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
      .splash-sub { margin-top: -8px; font-size: 13px; color: #8B95A1; }
      .splash-dots { display: flex; gap: 6px; margin-top: 6px; }
      .splash-dots i { width: 7px; height: 7px; border-radius: 50%; background: #3182F6; animation: splash-dot 1s ease-in-out infinite; }
      .splash-dots i:nth-child(2) { animation-delay: 0.15s; }
      .splash-dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-grow { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.04); } }
      @keyframes splash-dot { 0%, 80%, 100% { transform: translateY(0); opacity: 0.35; } 40% { transform: translateY(-6px); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .splash-icon, .splash-dots i { animation: none; } .splash-dots i { opacity: 0.6; } }
    </style>
  </head>
  <body class="min-h-screen antialiased break-keep selection:bg-toss-blueLight selection:text-toss-blue">
    <div id="root">
      <div class="splash" role="status" aria-label="불러오는 중">
        <img class="splash-icon" src="./icon-192.png" alt="" />
        <div class="splash-title">부자 가계부</div>
        <div class="splash-sub">태형이와 경은이의 부자 되기 프로젝트</div>
        <div class="splash-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
